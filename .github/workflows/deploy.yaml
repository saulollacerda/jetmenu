name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jetmenu_test
          POSTGRES_USER: jetmenu
          POSTGRES_PASSWORD: jetmenu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetmenu -d jetmenu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant execute permission
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Build
        run: ./mvnw clean package -DskipTests

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: .
        env:
          RAILWAY_TOKEN: ${{ secrets.JETMENU_RAILWAY_TOKEN }}
        run: railway up --service backend --detach

  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- run

      - name: Build
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: .
        env:
          RAILWAY_TOKEN: ${{ secrets.JETMENU_RAILWAY_TOKEN }}
        run: railway up --service frontend --detach
