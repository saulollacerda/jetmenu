# ============================================================================
# Production Profile (with PostgreSQL)
# ============================================================================

# Port (Railway injects a dynamic $PORT)
server.port=${PORT:8080}

# Conexão com Supabase (use o Session Pooler em IPv4: aws-0-<region>.pooler.supabase.com:5432)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Flyway cria o schema; Hibernate apenas valida)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway (migrations versionadas em db/migration)
spring.flyway.enabled=true

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Supabase Auth (JWKS asimétrico)
supabase.issuer-uri=${SUPABASE_ISSUER_URI}
supabase.audience=${SUPABASE_AUDIENCE:authenticated}

# ---------------------------------------------------------------------------
# Jobs internos (Cloud Scheduler)
#
# A reconciliação diária do Anota.AI e a limpeza de payloads deixaram de ser @Scheduled e
# passaram a ser POST em /api/internal/jobs/*. A troca é o que permite o serviço escalar a
# zero: um cron interno exige instância viva 24h esperando o relógio.
#
# FECHADO POR PADRÃO: sem INTERNAL_JOBS_TOKEN configurado, os endpoints recusam tudo com 404.
# Um deploy sem a variável deixa o job parado — e visível no log do Cloud Scheduler — em vez
# de abrir uma rota que varre a base inteira. Gerar com `openssl rand -base64 32`.
app.internal-jobs.token=${INTERNAL_JOBS_TOKEN:}

# O cron interno de limpeza fica desligado: quem chama é o Cloud Scheduler.
app.jobs.cleanup-scheduler-enabled=${CLEANUP_SCHEDULER_ENABLED:false}

# ---------------------------------------------------------------------------
# Cold start
#
# Com o polling fora, o gargalo deixa de ser RAM ociosa e passa a ser o boot — que no Cloud Run
# é pago de novo a cada instância nova, não uma vez por deploy.
#
# Backfills de dados legados (BasicPlanSeeder, LegacyPendingSubscriptionBackfill,
# LegacyProductCategoryBackfill): são migrações de uma vez só, já feitas aqui. O custo que
# restava eram as consultas que descobrem que não há nada a fazer — inclusive dois findAll()
# inteiros. Religar é setar a variável, e vale fazer isso num deploy após alterar dados legados
# à mão.
app.startup.backfills-enabled=${STARTUP_BACKFILLS_ENABLED:false}

# Catálogo da Stripe: era uma chamada à API deles em todo boot, com transação aberta durante a
# ida à rede. Passou para o Cloud Scheduler (POST /api/internal/jobs/stripe-catalog-sync).
app.startup.stripe-catalog-sync-enabled=${STARTUP_STRIPE_CATALOG_SYNC_ENABLED:false}

# Beans criados sob demanda em vez de todos no boot. O que a aplicação de fato usa numa entrega
# de webhook é uma fatia pequena do contexto; o resto deixa de ser construído em cada cold
# start. O preço é que erro de configuração aparece no primeiro uso e não no boot — aceitável
# aqui porque a suíte de testes sobe o contexto inteiro, sem lazy, a cada build.
spring.main.lazy-initialization=${SPRING_LAZY_INIT:true}

# Logging
logging.level.root=INFO
logging.level.com.jetmenu=INFO

# Anota.AI integration
#
# POLLING DESLIGADO: em produção quem traz os pedidos é o webhook
# (POST /api/webhooks/anotaai/{merchantId}), que entrega na hora e não gera tráfego de saída.
# A flag suprime o bean OrderSyncScheduler inteiro, então não sobra nem o tick de 10 minutos —
# é o que permite o serviço dormir fora de uso. Religar é só setar a env var, sem deploy.
# A rede de segurança para uma entrega perdida é a reconciliação diária, não este scheduler.
anotaai.polling-enabled=${ANOTAAI_POLLING_ENABLED:false}
anotaai.orders-base-url=${ANOTAAI_ORDERS_BASE_URL:https://api-parceiros.anota.ai}
anotaai.menu-base-url=${ANOTAAI_MENU_BASE_URL:https://api-menu.anota.ai}

# FLAG TEMPORÁRIA — prévia dos pedidos do iFood pela Anota.AI (salesChannel=ifood),
# gravados com origin=IFOOD. Ligar por loja/ambiente via env var enquanto a integração
# direta com o iFood não assume esses pedidos; depois disso, desligar para não importar
# em dobro.
anotaai.import-ifood-orders-enabled=${ANOTAAI_IMPORT_IFOOD_ORDERS_ENABLED:false}

# ---------------------------------------------------------------------------
# Stripe - the payment provider (hosted Checkout Sessions in subscription mode)
#
# Identical to application-dev.properties on purpose: SANDBOX AND PRODUCTION DIFFER
# BY VALUES ONLY. Set these in the Railway dashboard to the LIVE-mode values
# (STRIPE_API_KEY=sk_live_..., STRIPE_WEBHOOK_SECRET=whsec_... of the live webhook
# endpoint). Test-mode values in the same variables turn this deployment into a sandbox
# with no code change.
#
# No price id here: plans are created in the Stripe dashboard and mirrored into the plans
# table by StripeCatalogSync. Production reads the live-mode catalog, dev reads the
# test-mode one, from the same code — because each key sees only its own mode's catalog.
#
# Defaults stay empty so a deploy without the variables still boots: checkout then
# answers 503 with a pt-BR ProblemDetail instead of crashing with a 500.
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Frontend base URL - used to build the Stripe checkout success/cancel return URLs
app.frontend-base-url=${APP_FRONTEND_BASE_URL}

# iFood integration
# Connection flow stays blocked in prod until iFood homologation passes;
# flip IFOOD_CONNECTION_ENABLED=true (Railway dashboard) to release it without a deploy.
ifood.connection-enabled=${IFOOD_CONNECTION_ENABLED:false}
# POLLING DESLIGADO: nenhum lojista depende do iFood enquanto a homologação não anda, e o tick
# de 30 segundos era o maior consumidor de RAM ociosa da conta. A flag suprime o bean
# IfoodOrderSyncScheduler; o código do sync continua inteiro e volta com a env var.
ifood.polling-enabled=${IFOOD_POLLING_ENABLED:false}
ifood.client-id=${IFOOD_CLIENT_ID}
ifood.client-secret=${IFOOD_CLIENT_SECRET}
ifood.auth-base-url=${IFOOD_AUTH_BASE_URL:https://merchant-api.ifood.com.br/authentication/v1.0}
ifood.order-base-url=${IFOOD_ORDER_BASE_URL:https://merchant-api.ifood.com.br/order/v1.0}
ifood.catalog-base-url=${IFOOD_CATALOG_BASE_URL:https://merchant-api.ifood.com.br/catalog/v2.0}
ifood.merchant-base-url=${IFOOD_MERCHANT_BASE_URL:https://merchant-api.ifood.com.br/merchant/v1.0}
# Lojas liberadas para a tela de diagnóstico do catálogo (homologação): lista separada por
# vírgulas, aceita o id do merchant no JetMenu (UUID) ou o id dele no iFood. Vazio (o default)
# mantém a tela fechada para todo mundo — liberar é só setar a env no Railway, sem deploy.
ifood.diagnostics-merchant-ids=${IFOOD_DIAGNOSTICS_MERCHANT_IDS:}

