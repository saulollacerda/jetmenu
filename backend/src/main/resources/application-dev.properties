# ============================================================================
# Development Profile
# ============================================================================

# Loads backend/.env (KEY=VALUE, same syntax as .properties) when present.
# "optional:" means startup doesn't fail if the file is missing. Two candidate
# paths are listed because the working directory differs by how the app is run:
# - ./mvnw spring-boot:run (from backend/)        → cwd = backend/        → .env
# - IDE run configs (IntelliJ defaults to project root) → cwd = project root → backend/.env
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/jetmenu_dev
spring.datasource.username=jetmenu
spring.datasource.password=jetmenu
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=false

# Tomcat access log (dev only): one line per request with method, path and status.
# Invaluable when a client reports an error that never reaches controller logs
# (401s from JwtAuthFilter and 400s from request binding leave no other trace).
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${java.io.tmpdir}
server.tomcat.accesslog.prefix=jetmenu_access
server.tomcat.accesslog.pattern=%t %m %U %s %b %D

# Local auth provider (dev only): identities created by the dev auth endpoints use
# this provider name, which AuthHelper resolves against. Prod keeps the default "supabase".
app.auth.provider=local

# Anota.AI integration (mock servers para desenvolvimento)
# Polling LIGADO em desenvolvimento: não há URL pública para a Anota.AI chamar de volta, então
# sem ele nenhum pedido aparece na máquina local. Em produção fica desligado — lá o webhook faz
# esse trabalho.
anotaai.polling-enabled=${ANOTAAI_POLLING_ENABLED:true}
anotaai.orders-base-url=https://api-parceiros.anota.ai
anotaai.menu-base-url=https://api-menu.anota.ai

# FLAG TEMPORÁRIA — prévia dos pedidos do iFood pela Anota.AI.
# A Anota.AI já devolve em /ping/list os pedidos que a loja recebeu pelo iFood
# (salesChannel=ifood). Ligada, esses pedidos são importados com origin=IFOOD, dando ao
# lojista uma amostra do que verá quando a integração direta com o iFood entrar no ar.
# Desligar (ou remover) assim que a integração direta assumir esses pedidos — senão eles
# entram por dois caminhos.
anotaai.import-ifood-orders-enabled=${ANOTAAI_IMPORT_IFOOD_ORDERS_ENABLED:false}

# Billing (dev only): auto-assign this plan on sign-up so a new account is
# immediately usable without going through checkout. The plan row is seeded by
# BasicPlanSeeder. Prod deliberately leaves this unset, which keeps new accounts
# on plan=null/PENDING and forces them through the regular billing flow.
# The value is "Básico": .properties files are read as ISO-8859-1, so the accent
# must be escaped or the name silently stops matching the seeded plan.
app.billing.default-plan-name=B\u00e1sico

# ---------------------------------------------------------------------------
# Stripe — the payment provider (hosted Checkout Sessions in subscription mode)
#
# SANDBOX vs PRODUCTION IS A MATTER OF VALUES ONLY. The same code runs in both:
# point these at Stripe test mode here (sk_test_... / whsec_... / a price_... created
# in test mode) and at the live-mode equivalents in application-prod.properties.
# There is no profile switch, no feature flag and no schema difference.
#
# All three default to EMPTY so the app still boots unconfigured. With an empty
# STRIPE_API_KEY, POST /api/subscription/checkout answers 503 with a pt-BR
# ProblemDetail - never a 500 and never a silent success.
#
# There is no price id here. Plans are created in the Stripe dashboard and mirrored into
# the plans table by StripeCatalogSync (at boot, and on demand), keyed by the Price's
# lookup_key. Adding a plan costs no property, no env var and no deploy.
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Frontend base URL - used to build the Stripe checkout success/cancel return URLs
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# Jobs internos: em dev o cron de limpeza continua rodando dentro da app (não há Cloud
# Scheduler aqui), e o token dos endpoints tem um default para dar para chamá-los à mão.
app.internal-jobs.token=${INTERNAL_JOBS_TOKEN:dev-internal-job-token}
app.jobs.cleanup-scheduler-enabled=${CLEANUP_SCHEDULER_ENABLED:true}

# iFood integration
ifood.connection-enabled=${IFOOD_CONNECTION_ENABLED:true}
ifood.polling-enabled=${IFOOD_POLLING_ENABLED:true}
ifood.client-id=${IFOOD_CLIENT_ID:}
ifood.client-secret=${IFOOD_CLIENT_SECRET:}
ifood.auth-base-url=https://merchant-api.ifood.com.br/authentication/v1.0
ifood.order-base-url=https://merchant-api.ifood.com.br/order/v1.0
ifood.catalog-base-url=https://merchant-api.ifood.com.br/catalog/v2.0
ifood.merchant-base-url=https://merchant-api.ifood.com.br/merchant/v1.0
# Lojas liberadas para a tela de diagnóstico do catálogo (homologação): lista separada por
# vírgulas, aceita o id do merchant no JetMenu (UUID) ou o id dele no iFood. Vazio = fechado.
ifood.diagnostics-merchant-ids=${IFOOD_DIAGNOSTICS_MERCHANT_IDS:}
